<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro do Participante - SASI</title>
</head>
<body>
    <header>
        <h1>Cadastro do Palestrante</h1>
        <div class="logo">
            <h2>Portal SASI</h2>
            <img src="logo-white-ufrrj.svg" alt="Logo da UFRRJ">

        </div>
    </header>
    <main>
        <div class="title">
            <h2>Bem vindo, palestrante!</h2>
            <p>Preencha o cadastro abaixo para promover uma palestra na Semana Acadêmica de Sistemas de Informação</p>
        </div>
        <div class="cadastro-container">
            <span>Cadastro</span>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Digite seu email" required>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>
            <a href="#" id="esqueci-senha">Esqueci minha senha</a>
            <button>Entrar</button>
        </div>
    </main>
</body>
</html>
