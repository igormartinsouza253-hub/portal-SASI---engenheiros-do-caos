<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro do Palestrante - SASI</title>
</head>
<body>
    <header>
        <a href="index.html" class="voltar"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left preview-icon"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Voltar</a>
        <h1>Cadastro do Palestrante</h1>
        <div class="logo">
            <h2>Portal SASI</h2>
            <img src="logo-white-ufrrj.svg" alt="Logo da UFRRJ">
        </div>
    </header>
    <main>
        <div class="title">
            <h2>Bem-vindo!</h2>
            <p>Acesse sua área para cadastrar uma nova palestra ou oficina.</p>
        </div>
        <div class="cadastro-container">
            <form action="Inscricaodepalestra.html" method="get">
                <span>Login</span>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                <a href="#" id="esqueci-senha">Esqueci minha senha</a>
                <button type="submit">Confirmar</button>
            </form>
        </div>
    </main>
</body>
</html>
